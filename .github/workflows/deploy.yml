# CI/CD в стиле mastersapp: проверки → сборка образа в GHCR → webhook Dokploy.
# Dokploy только тянет готовый образ (pull_policy: always), на сервере ничего
# не компилируется. Авто-деплой Dokploy на push должен быть выключен: деплой
# запускает этот workflow ПОСЛЕ успешной сборки, иначе Dokploy подтянет
# предыдущий :latest.
#
# Один раз настроить:
#   1. Dokploy → Compose → Webhook → скопировать URL.
#   2. gh secret set DOKPLOY_DEPLOY_WEBHOOK -R SeRGei93/meme
#   3. Dokploy → Settings → Registry: ghcr.io + PAT с read:packages
#      (или сделать пакет ghcr.io/sergei93/meme-brain публичным).
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "plugin/**"
      - "tools/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sergei93/meme-brain

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go vet and tests
        run: cd server && go vet ./... && go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Contract tests
        run: cd tools && npm ci && npm test
      - name: Plugin tests and typecheck
        run: cd plugin/second-brain && npm ci && npm test && npm run typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Запускается только после успешной сборки: к этому моменту :latest уже
  # указывает на новый коммит.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          IMAGE_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK не задан — деплой пропущен. Добавьте webhook в secrets."
            exit 0
          fi

          # Dokploy проверяет ветку по GitHub-payload. Синтетический коммит с
          # путями сервера нужен, чтобы watch paths тоже сработали.
          commits=$(jq -c '[.commits[]? | {added: (.added // []), modified: (.modified // []), removed: (.removed // [])}] + [{"added":[],"modified":["server/cmd/brain/main.go","server/Dockerfile","docker-compose.yml",".github/workflows/deploy.yml"],"removed":[]}]' "$GITHUB_EVENT_PATH")

          payload=$(mktemp)
          jq -n \
            --arg ref "refs/heads/${DEPLOY_REF}" \
            --arg sha "${IMAGE_SHA}" \
            --arg message "${DEPLOY_MESSAGE:-$IMAGE_SHA}" \
            --argjson commits "$commits" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: $commits}' > "$payload"

          status=$(curl --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 5 \
            -o /tmp/dokploy-response.json -w '%{http_code}' \
            -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary "@$payload")
          cat /tmp/dokploy-response.json || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy webhook failed with HTTP $status"
            exit 1
          fi
          echo "Dokploy deploy triggered for ${IMAGE_SHA}"
