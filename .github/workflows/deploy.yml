# CI/CD в стиле mastersapp: проверки → сборка образа в GHCR → тег деплоя.
# Dokploy только тянет готовый образ (pull_policy: always), на сервере ничего
# не компилируется.
#
# Dokploy: Trigger Type = Tag, Autodeploy = ON. Push ветки main его не трогает;
# после успешной сборки workflow пушит тег deploy-<run_id>, и Dokploy деплоит
# уже готовый :latest. Webhook при выключенном Autodeploy отвечает
# "Automatic deployments are disabled", поэтому используется тег.
#
# Один раз настроить: Dokploy → Settings → Registry (ghcr.io + PAT read:packages)
# либо оставить пакет публичным. Compose Path: /docker-compose.yml.
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "plugin/**"
      - "tools/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/sergei93/meme-brain

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go vet and tests
        run: cd server && go vet ./... && go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Contract tests
        run: cd tools && npm ci && npm test
      - name: Plugin tests and typecheck
        run: cd plugin/second-brain && npm ci && npm test && npm run typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Запускается только после успешной сборки. Dokploy настроен на Trigger Type
  # "Tag" + Autodeploy ON: push ветки его не трогает, а тег ниже запускает
  # деплой уже готового :latest. Webhook при выключенном Autodeploy Dokploy
  # отклоняет ("Automatic deployments are disabled"), поэтому тег надёжнее.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Push deploy tag
        run: |
          tag="deploy-${GITHUB_RUN_ID}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Pushed $tag; Dokploy deploys tag builds after the image push."
