# Прод-стек для Dokploy. Образ собирается в GitHub Actions и публикуется в
# GHCR; Dokploy только тянет готовый :latest и перезапускает контейнер.
# Никакой сборки на сервере нет.
#
# Compose Path в Dokploy: /docker-compose.yml
# Registry в Dokploy: ghcr.io + PAT read:packages, либо пакет публичный.
name: second-brain

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  brain:
    image: ghcr.io/sergei93/meme-brain:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    environment:
      BRAIN_ADMIN_TOKEN: ${BRAIN_ADMIN_TOKEN:?set BRAIN_ADMIN_TOKEN in Dokploy Environment}
      BRAIN_ADDR: 0.0.0.0:8080
      BRAIN_DB: /data/brain.db
      BRAIN_LLM_BASE_URL: ${BRAIN_LLM_BASE_URL:-}
      BRAIN_LLM_API_KEY: ${BRAIN_LLM_API_KEY:-}
      BRAIN_LLM_MODEL: ${BRAIN_LLM_MODEL:-}
      BRAIN_LLM_MAX_INPUT_CHARS: ${BRAIN_LLM_MAX_INPUT_CHARS:-24000}
    volumes:
      - brain-data:/data
    healthcheck:
      test: ["CMD", "/brain", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: unless-stopped
    logging: *logging

volumes:
  brain-data:
